<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qayam Traders Dashboard</title>
<meta name="description" content="Design prototype: role-aware dashboard and fast New Bill flow for Qayam Traders ERP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens (light) ---------- */
:root{
  color-scheme:light;
  --bg:#f1f5fb;--card:#ffffff;--card-2:#f6f8fc;--tx:#0f1b2d;--tx-2:#3d4e67;--mu:#66768d;--bd:#e3e9f2;--bd-2:#d2dae6;
  --nav:#0d1a2d;--nav-2:#12263f;--nav-tx:#b8c7dd;
  --ac:#2563eb;--ac-2:#12a9b8;--ac-soft:rgba(37,99,235,.10);--ac-tx:#1d4ed8;
  --s1:#2a78d6;--s2:#eb6834;--grid:#e9eef5;--axis:#c9d3e1;--spark:#a9b8cc;--other:#b9c4d3;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--good-tx:#006300;--bad-tx:#b42318;
  --o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#184f95;--o1-tx:#0b0b0b;--o2-tx:#fff;--o3-tx:#fff;--o4-tx:#fff;
  --shadow:0 1px 2px rgba(15,30,60,.05),0 18px 40px -22px rgba(15,30,60,.30);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a1220;--card:#111b2c;--card-2:#152238;--tx:#e7eef8;--tx-2:#b9c6d8;--mu:#8a9ab1;--bd:#203049;--bd-2:#2a3c58;
    --nav:#060d18;--nav-2:#0c1a2e;--ac:#3b82f6;--ac-soft:rgba(59,130,246,.16);--ac-tx:#8ab4ff;
    --s1:#3987e5;--s2:#d95926;--grid:#1b2940;--axis:#2c3d57;--spark:#4d6080;--other:#3a4b66;
    --good-tx:#0ca30c;--bad-tx:#ff8a80;
    --o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o1-tx:#fff;--o2-tx:#fff;--o3-tx:#fff;--o4-tx:#0b0b0b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1220;--card:#111b2c;--card-2:#152238;--tx:#e7eef8;--tx-2:#b9c6d8;--mu:#8a9ab1;--bd:#203049;--bd-2:#2a3c58;
  --nav:#060d18;--nav-2:#0c1a2e;--ac:#3b82f6;--ac-soft:rgba(59,130,246,.16);--ac-tx:#8ab4ff;
  --s1:#3987e5;--s2:#d95926;--grid:#1b2940;--axis:#2c3d57;--spark:#4d6080;--other:#3a4b66;
  --good-tx:#0ca30c;--bad-tx:#ff8a80;
  --o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#86b6ef;--o1-tx:#fff;--o2-tx:#fff;--o3-tx:#fff;--o4-tx:#0b0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -22px rgba(0,0,0,.7);
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
.mu{color:var(--mu)}.tx2{color:var(--tx-2)}
.num{font-variant-numeric:tabular-nums}
kbd{font:600 11px/1 'Source Sans 3',system-ui,sans-serif;border:1px solid var(--bd-2);border-bottom-width:2px;border-radius:6px;padding:3px 6px;color:var(--mu);background:var(--card)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--nav),var(--nav-2));color:var(--nav-tx);display:flex;flex-direction:column;padding:12px;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#12a9b8);color:#fff;box-shadow:0 14px 26px -16px #2563eb}
.brand b{font-size:17px;display:block;line-height:1.2}.brand small{opacity:.85;font-size:12px}
.nav{margin-top:12px;display:flex;flex-direction:column;gap:2px;position:relative}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;color:inherit;text-decoration:none;cursor:pointer;position:relative;z-index:1;transition:color .2s,background .2s;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{color:#fff}
.nav .ind{position:absolute;left:0;right:0;top:0;height:40px;border-radius:12px;background:linear-gradient(90deg,#3b82f6,#2563eb);box-shadow:0 10px 22px -10px #3b82f6;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .2s;z-index:0;pointer-events:none}
.nav .sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.5;padding:14px 12px 4px;font-weight:600}
.nav .tag{margin-left:auto;font-size:10.5px;border-radius:999px;padding:1px 8px;font-weight:600}
.tag.k{border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:0 6px;opacity:.8}
.tag.soon{background:rgba(18,169,184,.22);color:#7fe3ec}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.box .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:6px;font-weight:600}
.seg-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:10px}
.seg-ctl button{border:0;background:none;border-radius:8px;padding:6px 4px;font-size:12.5px;cursor:pointer;color:var(--nav-tx);font-weight:600;transition:background .2s,color .2s}
.seg-ctl button.on{background:#fff;color:#0f1b2d}
.side .link{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--nav-tx);cursor:pointer;padding:4px 0;font-size:13.5px}
.side .link:hover{color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--bd)}
.menu-btn{display:none}
.search{flex:1;min-width:0;max-width:480px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 12px;height:42px;color:var(--mu);cursor:pointer;transition:border-color .2s,box-shadow .2s;text-align:left}
.search:hover{border-color:var(--bd-2);box-shadow:0 6px 18px -12px rgba(15,30,60,.4)}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx-2);cursor:pointer;position:relative;transition:transform .15s,border-color .2s}
.ibtn:hover{border-color:var(--bd-2)}.ibtn:active{transform:scale(.95)}
.ibtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--card)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;height:42px;padding:0 16px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;box-shadow:0 10px 20px -12px var(--ac);transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{box-shadow:0 14px 26px -12px var(--ac)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.ghost:hover{border-color:var(--bd-2)}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.avatar{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.avatar i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#12a9b8);color:#fff;font-style:normal;font-weight:700}
.avatar b{display:block;font-size:14px;line-height:1.1}.avatar small{color:var(--mu);font-size:12px}
.view{padding:6px 28px 48px;max-width:1560px;width:100%}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 28px;color:#fff;background:#0f2a52;isolation:isolate;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;box-shadow:0 28px 48px -30px #1d4ed8}
.hero:before{content:'';position:absolute;inset:-45%;z-index:-2;background:radial-gradient(38% 48% at 22% 30%,#2563eb 0,transparent 62%),radial-gradient(34% 44% at 80% 18%,#12a9b8 0,transparent 62%),radial-gradient(40% 50% at 62% 92%,#4338ca 0,transparent 62%);filter:blur(8px);animation:aurora 20s ease-in-out infinite alternate}
.hero:after{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse at 85% 0,#000 0,transparent 65%);mask-image:radial-gradient(ellipse at 85% 0,#000 0,transparent 65%)}
@keyframes aurora{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(5%,-4%) rotate(9deg)}100%{transform:translate(-4%,5%) rotate(-7deg)}}
.hero .kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;opacity:.9;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:4px 10px;border-radius:999px}
.hero h1{margin:12px 0 6px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;opacity:.88;max-width:680px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.glass{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;font-weight:600;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,transform .15s}
.glass:hover{background:rgba(255,255,255,.22)}.glass:active{transform:scale(.97)}
.glass.pri{background:#fff;color:#0f2a52;border-color:#fff;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
.glass.pri:hover{background:#eef4ff}
.glass kbd{background:rgba(15,42,82,.08);color:inherit;border-color:rgba(15,42,82,.2)}
.glass:disabled{opacity:.6;cursor:not-allowed}
.stale{display:inline-flex;gap:6px;align-items:center;margin-top:10px;background:rgba(250,178,25,.18);border:1px solid rgba(250,178,25,.45);color:#ffe6a8;padding:4px 10px;border-radius:999px;font-size:13px}

/* ---------- Filter row ---------- */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 2px;position:relative;z-index:15}
.range{position:relative}
.range-btn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600}
.range-btn:hover{border-color:var(--bd-2)}
.menu{position:absolute;top:46px;left:0;width:280px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 24px 50px -20px rgba(10,20,40,.45);padding:6px;z-index:25;transform-origin:top left;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.menu button.row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left}
.menu button.row:hover{background:var(--ac-soft)}
.menu .chk{width:16px;height:16px;display:grid;place-items:center}
.menu .chk svg{width:16px;height:16px;stroke-width:3;color:var(--ac)}
.menu .row.sel{font-weight:700}
.menu .foot{border-top:1px solid var(--bd);margin-top:6px;padding:10px 6px 4px;display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end}
.menu .foot label{font-size:12px;color:var(--mu)}
.menu .foot input{width:100%;height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--card-2);padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:13px;color:var(--tx-2)}
.chip.ok svg{color:var(--good)}.chip.warn svg{color:#c98500}

/* ---------- Grid & cards ---------- */
.grid{display:grid;gap:16px;margin-top:16px}
.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g-kpi.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (min-width:1700px){.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0;position:relative}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch h3{margin:0;font-size:16px;font-weight:700}
.ch .sub{color:var(--mu);font-size:13px;margin-top:2px}
.ch .tools{display:flex;gap:6px;align-items:center}
.tbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--mu);cursor:pointer}
.tbtn:hover{color:var(--tx);border-color:var(--bd-2)}.tbtn.on{color:var(--ac);border-color:var(--ac);background:var(--ac-soft)}
.tbtn svg{width:16px;height:16px}
.reveal{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}}
.t3{transition:transform .2s ease-out,box-shadow .25s;transform-style:preserve-3d}
.t3:hover{box-shadow:0 2px 4px rgba(15,30,60,.06),0 26px 44px -22px rgba(15,30,60,.38)}
.dim{opacity:.5;transition:opacity .2s}

/* KPI tile */
.kpi{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.kpi:before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--kc,#2563eb),transparent 80%);opacity:.9}
.kpi-h{display:flex;align-items:center;gap:10px;color:var(--tx-2);font-weight:600;font-size:14px}
.kpi-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,#2563eb) 14%,transparent);color:var(--kc,#2563eb)}
.kpi-ic svg{width:18px;height:18px}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-top:4px}
.kpi-f{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);min-height:28px;white-space:nowrap}
.kpi-f .spark{margin-left:auto}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700}
.delta svg{width:14px;height:14px;stroke-width:2.4}
.delta.good{color:var(--good-tx)}.delta.bad{color:var(--bad-tx)}.delta.flat{color:var(--mu)}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mu);background:var(--card-2);border:1px solid var(--bd);padding:1px 7px;border-radius:999px;margin-left:auto;font-weight:600}
.lock svg{width:12px;height:12px}

/* Charts */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--tx-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block}
.lk{width:16px;height:2px;border-radius:2px}.rk-key{width:10px;height:10px;border-radius:3px}
.k-s1{background:var(--s1)}.k-s2{background:var(--s2)}
.chart{position:relative;width:100%;outline:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .ax{fill:var(--mu);font-size:11.5px;font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.s1{stroke:var(--s1)}.chart .ln.s2{stroke:var(--s2)}
.chart .ar{fill:var(--s1);opacity:.10}
.chart .end{stroke:var(--card);stroke-width:2}
.chart .end.s1{fill:var(--s1)}.chart .end.s2{fill:var(--s2)}
.chart .elab{fill:var(--tx);font-size:12px;font-weight:700}
.chart .xh{stroke:var(--tx-2);stroke-width:1;opacity:.35}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hd{stroke:var(--card);stroke-width:2}
.chart .hd.s1{fill:var(--s1)}.chart .hd.s2{fill:var(--s2)}
.draw{transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1)}
.fadein{animation:fadein 1s ease .5s both}@keyframes fadein{from{opacity:0}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--mu);font-weight:600;background:var(--card-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover td{background:var(--ac-soft)}
.scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}

/* Ranked bars */
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;cursor:default;outline:none;border-radius:8px}
.rk:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.rk-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.rk-n small{font-weight:400;color:var(--mu);margin-left:6px}
.rk-v{font-weight:700;font-size:14px;text-align:right}
.rk-t{grid-column:1/-1;height:10px}
.rk-t i{display:block;height:10px;width:0;background:var(--s1);border-radius:0 4px 4px 0;transition:width .9s cubic-bezier(.2,.8,.2,1),filter .15s}
.rk-t i.oth{background:var(--other)}
.rk.go .rk-t i{width:var(--w)}
.rk:hover .rk-t i,.rk:focus .rk-t i{filter:brightness(1.12)}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--bd);font-size:13.5px;color:var(--tx-2)}
.note svg{color:var(--ac);margin-top:1px}

/* Segmented bar */
.segbar{display:flex;gap:2px;height:28px;margin:6px 0 12px}
.sg{min-width:0;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:12.5px;font-weight:700;cursor:default;outline:none;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.sg:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sg span{white-space:nowrap}
.sg.o1{background:var(--o1);color:var(--o1-tx)}.sg.o2{background:var(--o2);color:var(--o2-tx)}.sg.o3{background:var(--o3);color:var(--o3-tx)}.sg.o4{background:var(--o4);color:var(--o4-tx)}
.sg:hover{filter:brightness(1.1)}
@keyframes grow{from{transform:scaleX(0)}}
.k-o1{background:var(--o1)}.k-o2{background:var(--o2)}.k-o3{background:var(--o3)}.k-o4{background:var(--o4)}
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow small{color:var(--mu);font-size:12.5px}
.li .amt{font-weight:700;text-align:right;white-space:nowrap}
.li .amt small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;background:var(--ac-soft);color:var(--ac-tx)}

/* Alerts */
.al{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--bd)}
.al:last-child{border-bottom:0}
.al .sev{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:1px;min-width:78px}
.al .sev svg{width:13px;height:13px;stroke-width:2.4}
.sev.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.sev.serious{background:color-mix(in srgb,var(--serious) 18%,transparent);color:#c2410c}
.sev.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#8a5a00}
.sev.info{background:var(--ac-soft);color:var(--ac-tx)}
:root[data-theme="dark"] .sev.serious{color:#ffb08f}:root[data-theme="dark"] .sev.warn{color:#ffd166}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sev.serious{color:#ffb08f}:root:not([data-theme="light"]) .sev.warn{color:#ffd166}}
.al b{display:block;font-size:14px}.al small{color:var(--mu);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.badge svg{width:12px;height:12px;stroke-width:2.6}
.badge.paid{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-tx)}
.badge.part{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#8a5a00}
.badge.due{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
.badge.na{background:var(--card-2);color:var(--mu);border:1px solid var(--bd)}

/* Insights */
.ins{display:flex;flex-direction:column;gap:10px}
.insight{display:flex;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 7%,var(--card)),var(--card));border:1px solid var(--bd);transition:transform .2s,border-color .2s}
.insight:hover{transform:translateX(3px);border-color:var(--bd-2)}
.insight .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--ac-soft);color:var(--ac-tx)}
.insight .ic svg{width:17px;height:17px}
.insight b{display:block;font-size:14px}.insight small{color:var(--mu);font-size:13px}
.ai-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;background:linear-gradient(90deg,#2563eb,#12a9b8,#4338ca,#2563eb);background-size:300% 100%;animation:shine 6s linear infinite}
.ai-pill svg{width:13px;height:13px}
@keyframes shine{to{background-position:300% 0}}

/* FBR */
.steps{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.step{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.step i{width:22px;height:22px;border-radius:50%;border:2px dashed var(--bd-2);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--mu);font-weight:700;flex:none}
.meter{height:8px;border-radius:999px;background:color-mix(in srgb,var(--s1) 16%,transparent);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--s1);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1) .3s}
.ready{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;margin-top:12px}
.ready span{color:var(--tx-2)}

/* Placeholder page */
.empty{text-align:center;padding:60px 20px}
.empty .ic{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac-tx)}
.empty .ic svg{width:28px;height:28px}
.empty h2{margin:0 0 6px}

/* Skeleton */
.sk{border-radius:12px;background:linear-gradient(90deg,var(--card-2) 25%,color-mix(in srgb,var(--card-2) 50%,var(--bd)) 50%,var(--card-2) 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* Tooltip */
.tip{position:fixed;left:0;top:0;pointer-events:none;z-index:200;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 16px 36px -14px rgba(5,15,35,.45);padding:9px 11px;font-size:13px;min-width:150px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .tt{color:var(--mu);font-size:12px;margin-bottom:4px;font-weight:600}
.tip .tr{display:flex;align-items:center;gap:8px;padding:2px 0}
.tip .tr b{font-variant-numeric:tabular-nums}
.tip .tr span{color:var(--mu);margin-left:auto;padding-left:10px}
.tip .key{width:12px;height:2px;border-radius:2px;flex:none}
.tip .key.box{height:10px;width:10px;border-radius:3px}

/* Toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:#0f1b2d;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;font-size:14px;animation:tin .35s cubic-bezier(.2,.9,.3,1.3)}
.toast svg{color:#5eead4}
.toast.out{animation:tout .25s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}

/* Command palette */
.overlay{position:fixed;inset:0;background:rgba(5,12,24,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:150;display:none;animation:fade .2s}
.overlay.open{display:block}
@keyframes fade{from{opacity:0}}
.cmdk{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);z-index:160;display:none;overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.cmdk.open{display:block}
.cmdk .q{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.cmdk .q input{flex:1;border:0;background:none;outline:none;font-size:17px}
.cmdk .res{max-height:52vh;overflow:auto;padding:6px}
.cmdk .grp{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:10px 10px 4px;font-weight:700}
.cmdk .it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.cmdk .it.on{background:var(--ac-soft)}
.cmdk .it small{margin-left:auto;color:var(--mu)}

/* ---------- New Bill drawer ---------- */
.drawer{position:fixed;inset:0;z-index:100;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(5,12,24,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .25s}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(1040px,100%);background:var(--bg);box-shadow:-30px 0 60px -30px rgba(0,0,0,.55);display:flex;flex-direction:column;animation:slide .5s cubic-bezier(.16,1,.3,1)}
.drawer.closing .panel{animation:slideout .3s cubic-bezier(.4,0,1,1) forwards}
.drawer.closing .scrim{animation:fade .3s reverse forwards}
@keyframes slide{from{transform:translateX(60px);opacity:0}}
@keyframes slideout{to{transform:translateX(60px);opacity:0}}
.ph{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--bd);background:var(--card)}
.ph h2{margin:0;font-size:20px}
.ph .no{font-variant-numeric:tabular-nums;color:var(--mu);font-size:13px}
.pb{flex:1;overflow:auto;padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.fld{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:12px;position:relative}
.inp{display:flex;align-items:center;gap:10px;height:46px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);padding:0 12px;margin-top:5px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
.inp input{flex:1;border:0;background:none;outline:none;font-size:15.5px;min-width:0;color:var(--tx)}
.inp svg{color:var(--mu)}
.opts{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 24px 50px -20px rgba(10,20,40,.45);padding:6px;z-index:20;max-height:320px;overflow:auto;animation:pop .15s ease}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--tx);font-weight:400}
.opt.on{background:var(--ac-soft)}
.opt .grow{flex:1;min-width:0}.opt b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{color:var(--mu);font-size:12.5px}
.opt .r{text-align:right;font-size:13px;white-space:nowrap}
.opt.empty{color:var(--mu);cursor:default}
.cinfo{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--bd);margin:-2px 0 14px;animation:up .35s ease}
.cinfo .grow{flex:1;min-width:0}
.cinfo b{display:block}.cinfo small{color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chipbtn{border:1px dashed var(--bd-2);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--tx-2)}
.chipbtn:hover{border-style:solid;border-color:var(--ac);color:var(--ac-tx)}
.lines{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.lh,.lr{display:grid;grid-template-columns:minmax(0,1fr) 132px 112px 120px 36px;gap:10px;align-items:center;padding:10px 14px}
.lh{font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--card-2);border-bottom:1px solid var(--bd)}
.lr{border-bottom:1px solid var(--bd);animation:rowin .35s cubic-bezier(.2,.8,.2,1)}
.lr:last-child{border-bottom:0}
@keyframes rowin{from{opacity:0;transform:translateY(-6px);background:var(--ac-soft)}}
.lr .pn b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .pn small{font-size:12px;color:var(--mu)}
.lr .pn small.w{color:var(--crit);font-weight:600}
.qty{display:flex;align-items:center;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.qty:focus-within{border-color:var(--ac)}
.qty button{width:34px;height:36px;border:0;background:var(--card-2);cursor:pointer;display:grid;place-items:center;color:var(--tx-2)}
.qty button:hover{color:var(--ac)}
.qty button svg{width:15px;height:15px}
.qty input{width:100%;border:0;text-align:center;outline:none;background:none;height:36px;font-weight:700;min-width:0}
.rate{height:38px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);padding:0 8px;text-align:right;width:100%;outline:none;font-variant-numeric:tabular-nums}
.rate:focus{border-color:var(--ac)}
.lr .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.xbtn{width:32px;height:32px;border:0;border-radius:9px;background:none;color:var(--mu);cursor:pointer;display:grid;place-items:center}
.xbtn:hover{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
.noitems{padding:34px 16px;text-align:center;color:var(--mu)}
.noitems svg{width:30px;height:30px;color:var(--bd-2);margin-bottom:6px}
.sum{position:sticky;top:0;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.sum h3{margin:0 0 10px;font-size:16px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14.5px;font-variant-numeric:tabular-nums}
.srow span{color:var(--tx-2)}
.srow input{width:120px;height:34px;border:1.5px solid var(--bd);border-radius:9px;background:var(--card-2);text-align:right;padding:0 8px;outline:none}
.srow input:focus{border-color:var(--ac)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 12px;padding-top:12px;border-top:1px dashed var(--bd-2)}
.total span{font-weight:700}
.total b{font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px;color:var(--tx-2)}
.sw{width:40px;height:24px;border-radius:999px;background:var(--bd-2);position:relative;border:0;cursor:pointer;transition:background .2s;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.sw[aria-checked="true"]{background:var(--ac)}.sw[aria-checked="true"]:after{transform:translateX(16px)}
.pay{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--card-2);border:1px solid var(--bd);padding:4px;border-radius:12px;margin:6px 0 10px}
.pay button{border:0;background:none;border-radius:9px;padding:7px 2px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tx-2);transition:background .2s,color .2s}
.pay button.on{background:var(--card);color:var(--ac-tx);box-shadow:0 2px 8px -3px rgba(15,30,60,.35)}
.berr{color:var(--crit);font-size:13.5px;min-height:20px;margin:4px 0}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bacts{display:grid;gap:8px;margin-top:6px}
.bacts .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--mu);text-align:center;margin-top:8px}
.tw{font-size:12px;color:var(--mu)}
/* success */
.done{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;animation:up .5s ease}
.okmark{width:76px;height:76px;margin-bottom:12px}
.okmark circle{fill:none;stroke:var(--good);stroke-width:3;stroke-dasharray:240;stroke-dashoffset:240;animation:dash .7s ease forwards}
.okmark path{fill:none;stroke:var(--good);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dash .45s ease .55s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.receipt{background:#fff;color:#111;border-radius:6px;padding:16px 14px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-shadow:0 20px 40px -20px rgba(0,0,0,.45);position:relative}
.receipt:after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 5px,#fff 0) 0 0/10px 8px,linear-gradient(45deg,transparent 5px,#fff 0) 0 0/10px 8px}
.receipt .c{text-align:center}.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt .qr{width:88px;height:88px;border:1.5px dashed #888;margin:8px auto 4px;display:grid;place-items:center;text-align:center;font-size:10px;color:#666;padding:4px}

/* Mobile bottom bar */
.bbar{display:none}
.mfoot{display:none}
.scrim-side{display:none}

@media (max-width:1180px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21{grid-template-columns:1fr}.g-kpi.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.pb{grid-template-columns:1fr}.sum{position:static}.done{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
  .side.open{transform:none;box-shadow:30px 0 60px -20px rgba(0,0,0,.5)}
  .scrim-side.open{display:block;position:fixed;inset:0;background:rgba(5,12,24,.45);z-index:35;animation:fade .2s}
  .menu-btn{display:grid}
  .top{padding:10px 16px}
  .hide-m{display:none!important}
  .lock{font-size:0;gap:0;padding:2px 5px}.lock svg{width:12px;height:12px}
  .kpi-h{font-size:13px;align-items:flex-start}
  .mfoot{display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -10px 30px -18px rgba(0,0,0,.4)}
  .mfoot div{flex:1}.mfoot small{display:block;color:var(--mu);font-size:12px}.mfoot b{font-size:20px;font-variant-numeric:tabular-nums}
  .search{height:42px}
  .search kbd{display:none}
  .view{padding:4px 16px 110px}
  .hero{padding:20px;border-radius:20px}.hero h1{font-size:24px}
  .g-3,.g-11{grid-template-columns:1fr}
  .g-kpi,.g-kpi.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpi-f>span:nth-child(2){display:none}
  .kpi .val{font-size:21px}.kpi .spark{display:none}
  .card{padding:16px}
  .bbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);cursor:pointer;padding:4px 0;font-weight:600}
  .bbar button.on{color:var(--ac-tx)}
  .bbar .fab{width:52px;height:52px;border-radius:16px;margin:-22px auto 0;background:linear-gradient(135deg,#2563eb,#12a9b8);color:#fff;display:grid;place-items:center;box-shadow:0 14px 26px -10px #2563eb}
  .bbar .fab svg{width:24px;height:24px}
  .pb{padding:14px}
  .ph{padding:12px 14px}
  .lh{display:none}
  .lr{grid-template-columns:minmax(0,1fr) 36px;grid-template-areas:"pn x" "q r" "a a";row-gap:8px}
  .lr .pn{grid-area:pn}.lr .qty{grid-area:q}.lr .rate{grid-area:r}.lr .amt{grid-area:a;text-align:left}.lr .xbtn{grid-area:x}
  .lr{grid-template-columns:1fr 1fr 36px;grid-template-areas:"pn pn x" "q r r" "a a a"}
  .avatar div{display:none}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:vt .6s cubic-bezier(.4,0,.2,1)}
@keyframes vt{from{clip-path:circle(0 at var(--vx,90%) var(--vy,4%))}to{clip-path:circle(150vmax at var(--vx,90%) var(--vy,4%))}}
@media print{.side,.top,.bbar,.filters,.hero .acts{display:none}.app{display:block}.card{box-shadow:none;break-inside:avoid}}
</style>

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="rgba(255,255,255,.18)"/><path d="M20 8c5.2 6.2 8.3 9.8 8.3 14.4a8.3 8.3 0 01-16.6 0C11.7 17.8 14.8 14.2 20 8z" fill="#fff"/><path d="M16.5 22.5a3.6 3.6 0 003.5 3.6" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <div><b id="coName">Qayam Traders</b><small>Dairy distribution ERP</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="box">
        <div class="lbl">Preview as</div>
        <div class="seg-ctl" id="roleCtl" role="radiogroup" aria-label="Preview dashboard as role">
          <button data-role="admin" role="radio">Admin</button>
          <button data-role="accountant" role="radio">Accountant</button>
          <button data-role="worker" role="radio">Salesman</button>
        </div>
      </div>
      <div class="box">
        <div class="lbl">Data source</div>
        <div id="srcLbl" style="font-size:13.5px;color:#fff;font-weight:600">Demo data</div>
        <button class="link" data-act="load"><svg class="i" viewBox="0 0 24 24"><use href="#i-upload"/></svg>Load my qayam-data.json</button>
        <button class="link" data-act="demo" id="demoBtn" hidden><svg class="i" viewBox="0 0 24 24"><use href="#i-refresh"/></svg>Back to demo data</button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </div>
  </aside>
  <div class="scrim-side" id="sideScrim"></div>

/* ================= tooltip / toast ================= */
const tip = $('#tip');
function showTip(x, y, title, rows) {
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = title; tip.append(t);
  for (const r of rows) { const d = document.createElement('div'); d.className = 'tr'; if (r.key) { const k = document.createElement('i'); k.className = 'key ' + r.key; d.append(k); } const b = document.createElement('b'); b.textContent = r.v; const s = document.createElement('span'); s.textContent = r.n; d.append(b, s); tip.append(d); }
  tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let lx = x + 14, ly = y - h - 12;
  if (lx + w > innerWidth - 8) lx = x - w - 14; if (ly < 8) ly = y + 16; if (lx < 8) lx = 8;
  tip.style.transform = 'none'; tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
}
function hideTip() { tip.classList.remove('on'); }
function toast(msg, icon = 'checkc') {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = ic(icon); const s = document.createElement('span'); s.textContent = msg; t.append(s);
  $('#toasts').append(t); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2600);
}

function combo(input, list, src, onPick) {
  let items = [], idx = 0;
  const draw = () => { items = src(input.value.trim().toLowerCase()); idx = 0;
    list.innerHTML = items.length ? items.map((it, i) => `<div class="opt ${i ? '' : 'on'}" data-i="${i}" role="option">${it.html}</div>`).join('') : '<div class="opt empty">No match. Check the spelling.</div>';
    list.hidden = false; input.setAttribute('aria-expanded', 'true'); };
  const hl = () => { $$('.opt', list).forEach((o, i) => o.classList.toggle('on', i === idx)); list.children[idx]?.scrollIntoView({block: 'nearest'}); };
  const pick = it => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); onPick(it); };
  input.addEventListener('input', draw); input.addEventListener('focus', draw);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) draw(); idx = Math.min(idx + 1, items.length - 1); hl(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); hl(); }
    else if (e.key === 'Enter') { if (!list.hidden && items[idx]) { e.preventDefault(); pick(items[idx]); } }
    else if (e.key === 'Escape' && !list.hidden) { e.stopPropagation(); list.hidden = true; }
  });
  list.addEventListener('pointerdown', e => { const o = e.target.closest('.opt[data-i]'); if (o) { e.preventDefault(); pick(items[+o.dataset.i]); } });

}

  const mt = $('#mtot'); if (mt) mt.textContent = rs2(t.total);
}
function taxRows(t) { return BL.tax ? `<div class="srow"><span>Sales tax ${TAX.st}%</span><b>${rs2(t.st)}</b></div>${t.ft ? `<div class="srow"><span>Further tax ${TAX.ft}%</span><b>${rs2(t.ft)}</b></div>` : ''}` : ''; }
function updTotals() {
  const t = totals();
  BL.lines.forEach((l, i) => { const a = $('#a' + i); if (a) a.textContent = rs2((+l.q || 0) * (+l.rate || 0)); const w = $('#w' + i), m = lineWarn(l), p = S.D.prod[l.p]; if (w) { w.textContent = m || splitName(p.name)[1] || (S.role === 'worker' ? '' : NF0.format(p.stock) + ' in stock'); w.className = m ? 'w' : ''; } });
  $('#tsub').textContent = rs2(t.sub); $('#ttot').textContent = rs2(t.total); $('#trecv').textContent = rs2(t.recv);
  $('#tbal').textContent = BL.cust ? `${rs(t.prev)} → ${rs(t.after)}` : '–'; $('#taxrows').innerHTML = taxRows(t);
  const mt = $('#mtot'); if (mt) mt.textContent = rs2(t.total);
}
function saveBill(mode) {
  const err = $('#berr'), fail = m => { err.textContent = m; const s = $('#bsum'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); };
  if (!BL.cust) { fail('Choose a customer first.'); $('#bc').focus(); return; }
  const lines = BL.lines.filter(l => +l.q > 0);
  if (!lines.length) { fail('Add at least one product.'); $('#bp').focus(); return; }
  if (lines.some(l => !(+l.rate > 0))) return fail('Every item needs a rate above zero.');
  const over = lines.find(l => +l.q > Math.max(S.D.prod[l.p].stock, 0));
  if (over && mode !== 'draft') return fail(`Not enough stock: ${splitName(S.D.prod[over.p].name)[0]}. Save as draft, or fix the quantity.`);
  const t = totals(); BL.done = true; $('#mfoot')?.remove();
  const pb = $('#pb'), D = S.D, T = D.T, c = BL.cust;
  pb.innerHTML = `<div class="done"><div><svg class="okmark" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36"/><path d="M24 41l11 11 21-23"/></svg>
    <h2 style="margin:0 0 6px">${mode === 'draft' ? 'Draft saved' : 'Bill saved'} · ${esc(BL.no)}</h2>
    <p class="mu" style="margin:0 0 16px">${esc(nice(c.name))} · ${rs2(t.total)} · ${t.recv >= t.total ? 'paid in full' : t.recv > 0 ? rs2(t.recv) + ' received' : 'on credit'}. ${mode === 'draft' ? 'Drafts do not touch stock or the ledger.' : 'In the real app this posts stock, the ledger entry and the FBR submission together.'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="bill">${ic('plus')}Next bill</button><button class="btn ghost" data-act="printprev">${ic('printer')}Print</button><button class="btn ghost" data-act="wa">${ic('send')}WhatsApp</button><button class="btn ghost" data-act="closebill">Close</button></div>
    ${mode === 'draft' ? '' : `<div class="note" style="margin-top:18px">${ic('shield')}<div><b>FBR status: Pending</b><br>The gateway validates and posts the invoice to FBR. The FBR invoice number and QR code print on the bill once FBR returns Valid. If FBR is down, the bill waits in a queue and retries.</div></div>`}</div>
    <div class="receipt" aria-label="80 mm receipt preview"><div class="c"><b>${esc(T.name || 'Qayam Traders')}</b><br>${esc(T.addr || '')}<br>${esc(T.phone || '')}<br>NTN: ${esc(T.ntn || '—')}  STRN: ${esc(T.strn || '—')}</div><hr>
    <div class="r"><span>${BL.tax ? 'Sales Tax Invoice' : 'Invoice'}</span><span>${esc(BL.no)}</span></div><div class="r"><span>Date</span><span>${esc(fd(BL.date))}</span></div><div>To: ${esc(nice(c.name))}</div>${c.ntn ? `<div>NTN: ${esc(c.ntn)}</div>` : ''}<hr>
    ${lines.map(l => `<div>${esc(splitName(D.prod[l.p].name)[0])}</div><div class="r"><span>${NF0.format(l.q)} x ${NF2.format(l.rate)}</span><span>${NF2.format(l.q * l.rate)}</span></div>`).join('')}<hr>
    <div class="r"><span>Subtotal</span><span>${NF2.format(t.sub)}</span></div>${t.disc ? `<div class="r"><span>Discount</span><span>-${NF2.format(t.disc)}</span></div>` : ''}${t.st ? `<div class="r"><span>Sales tax ${TAX.st}%</span><span>${NF2.format(t.st)}</span></div>` : ''}${t.ft ? `<div class="r"><span>Further tax ${TAX.ft}%</span><span>${NF2.format(t.ft)}</span></div>` : ''}
    <div class="r"><b>TOTAL</b><b>${NF2.format(t.total)}</b></div><div class="r"><span>Received</span><span>${NF2.format(t.recv)}</span></div><hr>
    <div class="c">FBR Invoice No: <b>pending</b></div><div class="qr">FBR logo + QR code print here after FBR Valid</div><div class="c">${esc(T.foot || 'Thank you')}</div></div></div>`;
}

/* ================= mobile side ================= */
function openSide() { $('#side').classList.add('open'); $('#sideScrim').classList.add('open'); }
function closeSide() { $('#side').classList.remove('open'); $('#sideScrim').classList.remove('open'); }

/* ================= data loading ================= */
function useData(raw, src) {
  if (!raw || !['coa', 'P', 'C', 'J', 'I'].every(k => Array.isArray(raw[k]))) throw new Error('This file does not look like a Qayam Traders backup.');
  S.D = prep(raw); S.src = src;
  $('#coName').textContent = nice(raw.co || 'Qayam Traders');
  $('#srcLbl').textContent = src === 'demo' ? 'Demo data (fictional)' : `Your file · ${raw.C.length} customers, ${raw.J.length} entries`;
  $('#demoBtn').hidden = src === 'demo';
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { useData(JSON.parse(await f.text()), 'file'); render(); toast('Your data is loaded. It stays on this computer.'); }
  catch (x) { toast(x.message || 'Could not read this file', 'alert'); }
  e.target.value = '';
});

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go],[data-range],[data-role],[data-pay],[data-add],[data-rm],[data-qd],[data-bill],[data-ci]');
  if (!t) { if (!e.target.closest('.range')) closeRange(); return; }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.range) return setRange(t.dataset.range);
  if (t.dataset.role) { S.role = t.dataset.role; S.page = 'dash'; renderNav(); render(); return; }
  if (t.dataset.bill) return openBill(+t.dataset.bill);
  if (t.dataset.ci) return cmdkRun(+t.dataset.ci);
  if (t.dataset.pay) { BL.pay = t.dataset.pay; drawSum(); if (BL.pay === 'partial') $('#brecv')?.focus(); return; }
  if (t.dataset.add) return addLine(S.D.prod[+t.dataset.add]);
  if (t.dataset.rm) { BL.lines.splice(+t.dataset.rm, 1); drawLines(); drawSum(); return; }
  if (t.dataset.qd) { const i = +t.closest('.lr').dataset.li, l = BL.lines[i]; l.q = Math.max(0, r2((+l.q || 0) + +t.dataset.qd)); $('#q' + i).value = l.q; updTotals(); return; }
  switch (t.dataset.act) {
    case 'bill': return openBill();
    case 'closebill': return closeBill();
    case 'cmdk': return openCmdk();
    case 'closecmdk': return closeCmdk();
    case 'theme': return toggleTheme(e);
    case 'menu': return $('#side').classList.contains('open') ? closeSide() : openSide();
    case 'range': return $('#rangeMenu') ? closeRange() : openRange(t);
    case 'customrange': { const a = $('#cf').value, b = $('#ct').value; if (a && b && a <= b) setRange('custom', [a, b]); else toast('Pick a start date before the end date', 'alert'); return; }
    case 'tableview': S.tableView = !S.tableView; t.classList.toggle('on', S.tableView); { const R = curRange(), mc = $('#mainChart'); if (S.tableView) mc.innerHTML = chartTable(series(S.D, R.from, R.to)); else lineChart(mc, series(S.D, R.from, R.to), true); } return;
    case 'alerts': { const a = $('.al'); if (a) { a.closest('.card').scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'center'}); } else toast('No alerts on this view', 'bell'); return; }
    case 'load': return $('#file').click();
    case 'demo': useData(EMBED_OR_DEMO(true), 'demo'); render(); toast('Back to demo data'); return;
    case 'tax': BL.tax = !BL.tax; t.setAttribute('aria-checked', BL.tax); updTotals(); return;
    case 'save': return saveBill(t.dataset.mode);
    case 'printprev': return toast('Prints A4 or 80 mm thermal in the full app', 'printer');
    case 'wa': return toast('Sends the bill PDF to the customer on WhatsApp in the full app', 'send');
  }
});
document.addEventListener('input', e => {
  const id = e.target.id; if (!BL) return;
  if (/^q\d+$/.test(id)) { BL.lines[+id.slice(1)].q = +e.target.value || 0; updTotals(); }
  else if (/^r\d+$/.test(id)) { BL.lines[+id.slice(1)].rate = +e.target.value || 0; updTotals(); }
  else if (id === 'bdisc') { BL.disc = +e.target.value || 0; updTotals(); }
  else if (id === 'brecv') { BL.recv = +e.target.value || 0; updTotals(); }
  else if (id === 'cq') cmdkDraw();
});
document.addEventListener('keydown', e => {
  const k = e.key, drawerOpen = $('#drawer').classList.contains('open'), cmdkOpen = $('#cmdk').classList.contains('open');
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); return cmdkOpen ? closeCmdk() : openCmdk(); }
  if (k === 'F2') { e.preventDefault(); return openBill(); }
  if (cmdkOpen) { if (k === 'Escape') closeCmdk(); else if (k === 'ArrowDown') { e.preventDefault(); CX = Math.min(CX + 1, CI.length - 1); cmdkHl(); } else if (k === 'ArrowUp') { e.preventDefault(); CX = Math.max(CX - 1, 0); cmdkHl(); } else if (k === 'Enter') { e.preventDefault(); cmdkRun(CX); } return; }
  if (drawerOpen) {
    if (k === 'Escape') return closeBill();
    if (k === 'Enter' && (e.ctrlKey || e.metaKey) && !BL.done) { e.preventDefault(); return saveBill('print'); }
    if (k === 'Enter' && /^[qr]\d+$/.test(e.target.id)) { e.preventDefault(); $('#bp').focus(); }
    return;
  }
  if (k === 'Escape') { closeRange(); closeSide(); }
  if ((k === 'Enter' || k === ' ') && e.target.matches('#nav a')) { e.preventDefault(); go(e.target.dataset.go); }
});
addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), {passive: true});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { charts.forEach(f => f()); moveInd(); }, 150); });

/* ================= boot ================= */
function EMBED_OR_DEMO(forceDemo) { return !forceDemo && EMBED ? EMBED : demoData(); }
try { const th = localStorage.getItem('qt-theme'); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
setThemeIcon();
$('#view').innerHTML = `<div class="sk" style="height:150px;margin-top:6px"></div><div class="grid g-kpi">${'<div class="sk" style="height:118px"></div>'.repeat(6)}</div><div class="grid g-21"><div class="sk" style="height:330px"></div><div class="sk" style="height:330px"></div></div>`;
renderNav();
setTimeout(() => {
  useData(EMBED_OR_DEMO(false), EMBED ? 'file' : 'demo');
  if (EMBED) $('#srcLbl').textContent = `Your data (private preview) · ${EMBED.C.length} customers`;
  render();
}, RM ? 0 : 260);
})();
</script>
</body>
</html>
